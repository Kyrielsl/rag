[project]
name = "rag-kb"
version = "0.1.0"
description = "Enterprise knowledge base (MVP: txt/csv/json, exact search)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "boto3",
    "redis",
    "langchain",
    "langchain-openai",
    "python-jose[cryptography]",
    "passlib",
    "bcrypt==4.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]